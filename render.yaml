# Blueprint Render untuk KawanGizi.
#
# Pemindaian butuh DUA service yang hidup bersamaan:
#   1. kawangizi (https://kawangizi.onrender.com) — FastAPI YOLO, sudah ter-deploy
#   2. kawangizi-core-api — Go gateway yang memanggil service di atas
#
# Kegagalan yang paling sering terjadi: gateway ter-deploy tapi AI_BACKEND_URL
# dibiarkan http://127.0.0.1:8083. Backend tetap hidup, CORS tetap benar, namun
# setiap POST /api/scans membalas 502 karena tidak ada proses AI di dalam
# container gateway. Periksa `data.ai` di /api/health: `scanReady` harus true.
#
# CATATAN resource: lima model YOLO dimuat saat start. Paket free (512 MB) akan
# kehabisan memori; service AI butuh instance minimal 2 GB.

services:
  # ------------------------------------------------------------------ backend Go
  - type: web
    name: kawangizi-core-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o /tmp/kawangizi-api .
    startCommand: /tmp/kawangizi-api
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      # INI perbaikan yang membuat scan jalan di hosting. Service AI sudah ada di
      # kawangizi.onrender.com; tanpa baris ini gateway menembak loopback dan
      # setiap pindai berakhir 502.
      - key: AI_BACKEND_URL
        value: https://kawangizi.onrender.com
      # Pemindaian menunggu inferensi model; jangan lebih kecil dari
      # AI_REQUEST_TIMEOUT_SECONDS atau koneksi diputus sebelum respons tiba.
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: SERVER_WRITE_TIMEOUT_SECONDS
        value: "90"
      - key: CORS_ORIGINS
        value: https://kawangizi.rentgoindonesia.com
      - key: WEB_CLIENT_URL
        value: https://kawangizi.rentgoindonesia.com
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SSLMODE
        value: require
      # Pakai DATABASE_URL bila Render PostgreSQL tersedia; bila tidak, isi
      # bagian DB_* di bawah secara manual.
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

# Service AI (Python) sengaja tidak dideklarasikan di sini karena sudah berjalan
# di luar repo ini. Kalau perlu deploy ulang dari repo:
#
#   - type: web
#     name: kawangizi
#     runtime: python
#     rootDir: backend
#     buildCommand: pip install --no-cache-dir -r ai_service/requirements.txt
#     # 0.0.0.0 wajib: default uvicorn hanya mendengarkan di loopback sehingga
#     # request dari service lain ditolak.
#     startCommand: uvicorn app.main:app --app-dir ai_service --host 0.0.0.0 --port $PORT
#     healthCheckPath: /health